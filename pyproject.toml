[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-evolving-agents"
version = "0.1.0"
description = "ReasoningBank-style reasoning memory, provenance tracking and simulation-tested claim revision for agents in BSK-RL and DiscoveryWorld."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Onur Koc" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Spacecraft tasking on the Basilisk simulator (downloads ~116 MB of SPICE kernels on first use).
bsk = ["bsk>=2.12", "bsk-rl>=1.3.11", "gymnasium"]
# Scientific-discovery environment from Allen AI.
discoveryworld = ["discoveryworld>=0.0.2"]
# Claude backend (official SDK). Any release with the 2026-10-21 API version.
anthropic = ["anthropic>=2.0"]
# The embedding model the ReasoningBank paper used (gemini-embedding-001), through the official SDK.
gemini = ["google-genai>=1.0"]
# Any OpenAI-compatible server (OpenAI, vLLM, llama.cpp, LM Studio, Together, HF router, ...).
openai = ["openai>=1.60"]
# Ollama's own API, through the official client.
ollama = ["ollama>=0.5"]
# Models run on this machine: transformers for chat models, sentence-transformers for
# embeddings. Large (torch); not part of "all".
huggingface = ["transformers>=4.56", "torch>=2.2", "sentence-transformers>=3.0"]
plots = ["matplotlib"]
dev = ["pytest>=7.3", "ruff>=0.4"]
all = [
    "bsk>=2.12",
    "bsk-rl>=1.3.11",
    "gymnasium",
    "discoveryworld>=0.0.2",
    "anthropic>=2.0",
    "google-genai>=1.0",
    "openai>=1.60",
    "ollama>=0.5",
    "matplotlib",
]

[project.scripts]
sea = "self_evolving_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# BSK-RL pins pytest 7.3.1, whose assertion rewriter trips Python 3.13 deprecations.
filterwarnings = [
    "ignore:ast\\..*is deprecated:DeprecationWarning",
    "ignore:Attribute s is deprecated:DeprecationWarning",
]
markers = [
    "bsk: needs the Basilisk simulator and its SPICE kernels (slow, network on first run)",
    "discoveryworld: needs the discoveryworld package",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]
